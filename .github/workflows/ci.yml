name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: src/frontend/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: desktop-${{ runner.os }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Install frontend deps
        run: pnpm install --dir src/frontend --frozen-lockfile

      - name: Frontend build
        run: pnpm --dir src/frontend build

      - name: Frontend tests
        run: pnpm --dir src/frontend test --run

      - name: Rust tests
        run: cargo test --all --release --exclude expresso-review
