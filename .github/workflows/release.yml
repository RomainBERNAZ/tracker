name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write

jobs:
  prepare-source:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Archive build sources
        run: git archive --format=tar --output=source.tar HEAD Cargo.toml src src-tauri

      - name: Upload build sources
        uses: actions/upload-artifact@v4
        with:
          name: build-sources
          path: source.tar
          if-no-files-found: error

  build:
    needs: prepare-source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            bundles: appimage,deb
          - os: windows-latest
            platform: windows
            bundles: msi
    runs-on: ${{ matrix.os }}

    steps:
      - name: Download build sources
        uses: actions/download-artifact@v4
        with:
          name: build-sources
          path: source

      - name: Extract build sources
        run: tar -xf source/source.tar

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux deps for Tauri
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwebkit2gtk-4.1-dev \
            libsqlite3-dev \
            file

      - name: Install frontend deps
        run: pnpm install --dir src/frontend --frozen-lockfile

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build Tauri release
        run: cargo tauri build --config src-tauri/tauri.conf.json --bundles "${{ matrix.bundles }}"

      - name: Upload Linux installers
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload Windows MSI
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: target/release/bundle/msi/*.msi
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*.msi
          fail_on_unmatched_files: true
